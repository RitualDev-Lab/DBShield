name: CI & Matrix Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Configure Git for consistent line endings
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Code Quality & Style
        run: pnpm run check

      - name: Build TypeScript
        run: pnpm run build

      - name: Run Performance Benchmark
        env:
          PYTHONIOENCODING: "utf-8"
        run: python benchmarks/proxy_overhead_benchmark.py

      - name: Run Test Suite
        run: pnpm test

      - name: Test Python SDK
        run: |
          python -m pip install --require-hashes -r sdks/python/requirements-test.txt
          python -m pip install --no-deps -e sdks/python
          python -m pytest sdks/python/tests

      - name: Verify Tarball Packaging Gate
        run: npm pack --dry-run
