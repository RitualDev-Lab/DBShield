name: CI & Matrix Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Configure Git for consistent line endings
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Quality & Style
        run: pnpm run check

      - name: Build TypeScript
        run: pnpm run build

      - name: Run Performance Benchmark
        run: python benchmarks/proxy_overhead_benchmark.py

      - name: Run Test Suite
        run: pnpm test

      - name: Verify Tarball Packaging Gate
        run: npm pack --dry-run
