[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbshield-defense"
version = "0.2.1"
description = "Database Guardrail, SQL AST Firewall & Sandboxing Wire Proxy for AI Coding Agents in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "RitualDev Lab", email = "security@ritualdev.in" }
]
keywords = [
    "ai-agent-security",
    "database-security",
    "sql-guardrail",
    "langchain",
    "crewai",
    "llamaindex",
    "sqlalchemy",
    "sandbox",
    "mcp",
    "pii-masking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://ritualdev.in/dbshield/"
Repository = "https://github.com/RitualDev-Lab/DBShield"
Issues = "https://github.com/RitualDev-Lab/DBShield/issues"
Documentation = "https://ritualdev.in/dbshield/"
