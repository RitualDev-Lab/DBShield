[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbshield-defense"
version = "0.2.1"
description = "Database Guardrail, SQL AST Firewall & Sandboxing Wire Proxy for AI Coding Agents in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "RitualDev Lab", email = "security@ritualdev.in" }
]
keywords = [
    "ai-agent-security",
    "database-security",
    "sql-guardrail",
    "langchain",
    "crewai",
    "llamaindex",
    "sqlalchemy",
    "sandbox",
    "mcp",
    "pii-masking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3.0"
]
crewai = [
    "crewai>=0.80.0"
]
llamaindex = [
    "llama-index-core>=0.11.0"
]
sqlalchemy = [
    "sqlalchemy>=2.0.0"
]
all = [
    "dbshield-defense[langchain,crewai,llamaindex,sqlalchemy]"
]

[project.urls]
Homepage = "https://ritualdev.in/dbshield/"
Repository = "https://github.com/RitualDev-Lab/DBShield"
Issues = "https://github.com/RitualDev-Lab/DBShield/issues"
Documentation = "https://ritualdev.in/dbshield/"

[tool.setuptools.package-data]
dbshield = ["py.typed"]
