[package]
name = "dbshield-core"
version = "0.2.0"
edition = "2021"
authors = ["RitualDev Studio <engineering@ritualdev.in>"]
description = "High-performance zero-GC wire protocol proxy engine, connection pooling, and virtual shadow database for DBShield."
license = "MIT"
repository = "https://github.com/RitualDev-Lab/DBShield"
keywords = ["postgresql", "mysql", "wire-protocol", "shadow-database", "ai-agents"]

[lib]
name = "dbshield_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
sha2 = "0.10"
hmac = "0.12"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
