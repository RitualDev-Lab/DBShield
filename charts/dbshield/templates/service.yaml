apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbshield.fullname" . }}
  labels:
    {{- include "dbshield.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.proxyPort }}
      targetPort: postgres-proxy
      protocol: TCP
      name: postgres
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "dbshield.selectorLabels" . | nindent 4 }}
